<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂课件 · 邻居的颜色</title><link rel="stylesheet" href="style.css?v=20261020a"><style>body{background:#182b29;color:#eee8da}main{max-width:1280px;margin:auto;padding:20px}.slide-controls{display:flex;gap:12px;align-items:center;justify-content:center;margin:15px 0;flex-wrap:wrap}.slide-controls a{color:#c6decb}img{width:100%;display:block;max-height:calc(100vh - 150px);object-fit:contain}details{border-color:#506353;max-width:1100px;margin:auto}pre{white-space:pre-wrap}#page{font:18px Georgia,serif;padding:0 12px}.small{color:#b8c6b6}</style></head><body><main><div class="slide-controls"><a href="index.html#classroom">← 返回课程</a><button class="button" id="prev">上一页</button><span id="page"></span><button class="button" id="next">下一页</button><button class="button" id="full">全屏</button><a href="downloads/label-propagation.pptx" download>下载 PPTX</a></div><img id="slide" alt="课堂幻灯片"><p class="small" style="text-align:center">方向键切换 · Home/End 跳到首尾 · 共 16 页</p><details><summary>本页讲解备注与来源</summary><pre id="notes"></pre></details></main><script type="module">
const $=s=>document.querySelector(s);let i=Math.max(1,Math.min(16,Number(location.hash.slice(1))||1)),notes=[];
fetch('downloads/notes.json').then(r=>r.json()).then(n=>{notes=n;show()});function show(){location.hash=i;$('#page').textContent=i+' / 16';$('#slide').src='slides/slide-'+String(i).padStart(2,'0')+'.png';$('#slide').alt='课堂课件，第 '+i+' 页';$('#notes').textContent=notes[i-1]?.notes||'正在加载';$('#prev').disabled=i===1;$('#next').disabled=i===16;}
$('#prev').onclick=()=>{i=Math.max(1,i-1);show()};$('#next').onclick=()=>{i=Math.min(16,i+1);show()};$('#full').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='Home'){i=1;show()}if(e.key==='End'){i=16;show()}});show();
</script></body></html>
