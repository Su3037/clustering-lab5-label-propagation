name: Pull request checks
on: [pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 tests/crosscheck.py
      - run: python3 scripts/check_site.py
      - run: python3 tests/test_preview.py
